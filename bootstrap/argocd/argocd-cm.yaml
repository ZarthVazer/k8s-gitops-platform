apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # Poll Git every minute instead of every three (fine for a small lab)
  timeout.reconciliation: 60s

  # Health check for Application resources, so the root app waits for
  # each child app (sync waves) before moving on to the next one.
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
